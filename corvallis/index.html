<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Corvallis</title>
  <style>
    body {
      margin: 0;
      background: #050607;
      color: #D0D3D8;
      font-family: sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .badge-frame {
      width: 100vw;
      max-width: 430px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Time (top right) */
    .badge-time {
      position: absolute;
      top: 3%;
      right: 4%;
      z-index: 2;
      font-size: clamp(12px, 5vw, 28px);
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: #8E8E93;
    }

    /* Location + date (top left) */
    .badge-title {
      position: absolute;
      top: 3%;
      left: 4%;
      z-index: 2;
      font-weight: 400;
      line-height: 1.0;
      font-size: clamp(12px, 5vw, 28px);
      letter-spacing: -0.02em;
      color: #D0D3D8;
    }

    .badge-date {
      display: block;
      margin-top: 0px;
      color: #8E8E93;
    }

    /* Info (bottom right) */
    .badge-info {
      position: absolute;
      bottom: 4%;
      right: 4%;
      z-index: 2;

      width: clamp(22px, 6vw, 34px);
      height: clamp(22px, 6vw, 34px);

      border: 2px solid #8E8E93;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #8E8E93;
      font-size: clamp(14px, 4vw, 22px);
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
    }

    .badge-info:hover {
      color: #D0D3D8;
      border-color: #D0D3D8;
    }

    /* History (bottom left, clock icon) */
    .badge-history {
      position: absolute;
      bottom: 4%;
      left: 4%;
      z-index: 2;

      width: clamp(22px, 6vw, 34px);
      height: clamp(22px, 6vw, 34px);

      border: 2px solid #8E8E93;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;
    }

   .badge-history::before {
        content: "";
        position: absolute;

        width: 34%;
        height: 2.5px;
        background: #8E8E93;

        /* horizontal hand → 3 o'clock */
        left: 50%;
        top: 50%;
        transform: translateY(-50%);
    }

    .badge-history::after {
        content: "";
        position: absolute;
        width: 34%;
        height: 2.5px;
        background: #8E8E93;

        /* minute hand (points up, toward 12) */
        transform: rotate(-90deg);
        transform-origin: left center;

        left: 50%;
        top: 50%;
    }

    .badge-history:hover {
      border-color: #D0D3D8;
    }

    .badge-history:hover::before,
    .badge-history:hover::after {
      background: #D0D3D8;
    }

    .badge {
      width: 100%;
      height: 100%;
      transform: translate(0%, 0%);
    }

    .updated {
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="badge-frame">
      <div class="badge-time" id="time"></div>

      <div class="badge-title">
        Corvallis
        <span class="badge-date">May 21</span>
      </div>

      <a class="badge-history" href="history.html" aria-label="Historical forecasts"></a>

      <a class="badge-info" href="info.html" aria-label="Information about data and methods">i</a>

      <img class="badge" src="badge.svg" alt="Influenza risk badge">
    </div>

    <p class="updated">Last updated May 21, 2026 at 11:14 AM PDT</p>
    <p><a href="../">Back</a></p>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('time').textContent = `${hours}:${minutes} ${ampm}`;
    }

    updateTime();
    setInterval(updateTime, 60000);
  </script>

</body>
</html>
